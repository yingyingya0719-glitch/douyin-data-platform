v></div></div></div></section><section class="card span-6"><div class="card-head"><h3>高价值用户分群</h3><span>规则组合</span></div><div class="card-body"><div class="progress-list"><div class="progress-row"><span>融合套餐潜客</span><div class="bar"><i style="width:71%"></i></div><strong>18.6万</strong></div><div class="progress-row"><span>高频复购用户</span><div class="bar"><i style="width:48%;background:var(--blue)"></i></div><strong>12.4万</strong></div><div class="progress-row"><span>即将流失用户</span><div class="bar"><i style="width:27%;background:var(--red)"></i></div><strong>7.1万</strong></div><div class="progress-row"><span>终端升级潜客</span><div class="bar"><i style="width:38%;background:var(--amber)"></i></div><strong>9.8万</strong></div></div></div></section></div></div>`}

  function reports(){const cards=[['日报','运营晨报','核心指标、昨日直播复盘、爆款商品、售后异常与今日待办','每日 08:00','已生成'],['周报','周度经营复盘','各业务线贡献、直播主播排行、财务收支与问题计划','每周一 08:30','待更新'],['月报','月度经营分析','目标达成、区域贡献、投入产出、用户增长与利润核算','每月 1 日','已生成'],['专项','直播专项分析','分钟级流量成交、主播与商品表现、多场横向对比','手动生成','可生成'],['专项','达人合作复盘','ROI 排行、佣金支出、样品投入产出与分层名单','每月 25 日','已生成'],['专项','门店巡检报告','门店经营排名、问题清单、A/B/C/D 分级与帮扶建议','每周五','已生成']];return `<div class="view">${head('报表中心','会议级日报、周报、月报与专项分析模板，一键生成汇报材料',false)}<div class="hero-row" style="margin-top:-6px"><div class="filterbar"><button class="primary" id="makeReport">+ 新建自定义报表</button><button class="ghost export-trigger">批量导出</button></div></div><div class="report-list">${cards.map(x=>`<article class="report"><span class="report-type">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p><div class="report-meta"><span>${x[3]}</span><b>${x[4]}</b></div></article>`).join('')}</div><div class="card" style="margin-top:14px"><div class="card-head"><h3>报告生成记录</h3><button>查看历史 →</button></div><div class="table-wrap"><table class="table"><thead><tr><th>报告名称</th><th>周期</th><th>生成时间</th><th>文件格式</th><th>状态</th></tr></thead><tbody><tr><td data-label="报告名称">9月月度经营分析报告</td><td data-label="周期">2026.09.01—09.30</td><td data-label="生成时间">10-01 08:02</td><td data-label="文件格式">PPTX / PDF / XLSX</td><td data-label="状态"><span class="tag good">生成成功</span></td></tr><tr><td data-label="报告名称">第40周经营复盘</td><td data-label="周期">09.28—10.04</td><td data-label="生成时间">10-05 08:31</td><td data-label="文件格式">PDF / XLSX</td><td data-label="状态"><span class="tag good">生成成功</span></td></tr></tbody></table></div></div></div>`}
  function roles(){return `<div class="view">${head('组织与权限','集团、省、市、门店四级组织，按角色隔离数据与操作权限',false)}<div class="summary-strip"><div><span>组织节点</span><strong>2,684</strong></div><div><span>系统用户</span><strong>4,216</strong></div><div><span>自定义角色</span><strong>12</strong></div><div><span>近 7 日敏感操作</span><strong>186</strong></div></div><section class="card"><div class="card-head"><h3>标准角色</h3><button>权限矩阵 →</button></div><div class="card-body"><div class="role-grid">${[['集团管理员','全部模块 · 全集团范围','8'],['省公司管理员','本省查看 · 报表 · 人员','42'],['城市管理员','本市数据 · 运营配置','186'],['门店店长','本店订单 · 直播 · 职人','2,314'],['运营人员','所辖范围 · 盯盘 · 处理','1,286'],['财务人员','财务数据 · 对账 · 结算','68'],['数据分析师','脱敏全量 · 自定义报表','34'],['普通查看者','指定汇总看板 · 只读','278']].map(x=>`<article class="role"><b>${x[0]}</b><p>${x[1]}</p><strong>${x[2]}<small style="font:400 10px Noto Sans SC;color:var(--muted)"> 人</small></strong></article>`).join('')}</div></div></section><div class="grid-12">${tableCard('最近操作日志',['时间','用户','角色','操作','对象','结果'],[['10-08 14:26','王一鸣','集团管理员','导出','全国9月订单明细','<span class="tag good">通过</span>'],['10-08 13:58','李晓丹','财务人员','查看脱敏明细','9月佣金差异单','<span class="tag good">通过</span>'],['10-08 11:42','赵海','城市管理员','修改阈值','石家庄库存预警','<span class="tag good">成功</span>'],['10-08 10:16','陈立','运营人员','跨区查看','山东省经营数据','<span class="tag bad">已拒绝</span>']],'span-8')}<section class="card span-4"><div class="card-head"><h3>安全策略</h3><span>当前生效</span></div><div class="card-body"><div class="todo"><i>✓</i><span>数据行级隔离已开启</span></div><div class="todo"><i>✓</i><span>手机号 / 地址默认脱敏</span></div><div class="todo"><i>✓</i><span>敏感数据导出需审批</span></div><div class="todo"><i>✓</i><span>全部操作记录审计日志</span></div></div></section></div></div>`}
  const views={overview,stores,live,staff,kol,finance,profile,alerts,reports,roles};
  function setView(key){if(!views[key])key='overview';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===key));const item=navItems.find(x=>x[0]===key);title.textContent=item[1]==='经营总览'?'全国经营总览':item[1];content.innerHTML=views[key]();if(key==='finance')wireFin();content.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>setView(b.dataset.jump));content.querySelectorAll('.text-action').forEach(b=>b.onclick=()=>showToast('已切换至完整明细视图'));content.querySelectorAll('.export-trigger').forEach(b=>b.onclick=downloadCSV);const mk=$('#makeReport');if(mk)mk.onclick=()=>showToast('自定义报表画布已就绪（演示）');window.scrollTo({top:0,behavior:'smooth'});}
  function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._id);t._id=setTimeout(()=>t.classList.remove('show'),2200)}
  function downloadCSV(){const csv='指标,数值,环比\nGMV,128000000,12.6%\n支付订单,964000,8.3%\n转化率,2.93%,0.18%\n退款率,6.84%,-0.72%\n';const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='运营数据演示.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);showToast('演示数据 CSV 已下载')}
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  document.querySelectorAll('.period button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.period button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showToast('已切换至“'+b.textContent+'”口径')});
  $('#exportBtn').onclick=downloadCSV;$('#moreBtn').onclick=downloadCSV;$('#reportBtn').onclick=()=>$('#modal').classList.add('open');$('#closeModal').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('open')};$('#downloadDaily').onclick=()=>{downloadCSV();$('#modal').classList.remove('open')};
  function showMetricTip(el){const d=METRIC_DEFS[el.dataset.m];if(!d)return;const old=$('#metricTip');if(old&&old._for===el){old.remove();return}if(old)old.remove();const r=el.getBoundingClientRect(),w=Math.min(300,window.innerWidth-24);let left=Math.max(12,Math.min(r.left+r.width/2-w/2,window.innerWidth-w-12));const tip=document.createElement('div');tip.id='metricTip';tip.className='metric-tip';tip._for=el;tip.innerHTML=`<b>${el.dataset.m}</b><p>${d[0]}</p><p class="formula">计算：${d[1]}</p>`;document.body.appendChild(tip);tip.style.width=w+'px';let top=r.bottom+8;if(top+tip.offsetHeight>window.innerHeight-12)top=Math.max(12,r.top-tip.offsetHeight-8);tip.style.left=left+'px';tip.style.top=top+'px'}
document.addEventListener('click',e=>{const info=e.target.closest?e.target.closest('.info'):null;const tip=$('#metricTip');if(info){e.stopPropagation();showMetricTip(info)}else if(tip&&!(e.target.closest&&e.target.closest('#metricTip')))tip.remove()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const t=$('#metricTip');if(t)t.remove()}});
setView('overview');
